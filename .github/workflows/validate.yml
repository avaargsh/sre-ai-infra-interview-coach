name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate structure
        run: python tests/validate_skill.py
      - name: Validate local links
        run: python tests/check_references.py
      - name: Build Skill ZIP
        run: python scripts/package_skill.py
