name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate structure
        run: python tests/validate_skill.py
      - name: Validate local links
        run: python tests/check_references.py
      - name: Build Skill ZIP
        run: python scripts/package_skill.py
      - name: Upload Skill package for preview
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sre-ai-infra-interview-coach-skill
          path: dist/sre-ai-infra-interview-coach-skill.zip
          if-no-files-found: error
          retention-days: 14
