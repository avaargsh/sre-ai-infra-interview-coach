name: Build Skill Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Semantic version tag to publish (for example v0.1.0)"
        required: true
        type: string
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate
        run: |
          python tests/validate_skill.py
          python tests/check_references.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package
        run: python scripts/package_skill.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_name="$INPUT_TAG_NAME"
            if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must follow vMAJOR.MINOR.PATCH, e.g. v0.1.0" >&2
              exit 1
            fi
          else
            tag_name="$GITHUB_REF_NAME"
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$tag_name" dist/sre-ai-infra-interview-coach-skill.zip \
            --target "$GITHUB_SHA" \
            --title "SRE & AI Infrastructure Interview Coach $tag_name" \
            --generate-notes
